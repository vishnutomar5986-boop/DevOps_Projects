name: Project 02 - Docker CI/CD Deployment

on:
  push:
    branches:
      - main
    paths:
      - 'Project-02-Docker-Nginx-GitHub-Actions/**'

  workflow_dispatch:

jobs:
  build-and-deploy:
    name: Build, Push and Deploy
    runs-on: ubuntu-latest

    steps:

      # ----------------------------------------
      # 1. Checkout repository
      # ----------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # ----------------------------------------
      # 2. Login to Docker Hub
      # ----------------------------------------
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # ----------------------------------------
      # 3. Build Docker image
      # ----------------------------------------
      - name: Build Docker image
        run: |
          docker build \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/project-02-docker-nginx-github-actions:latest \
            ./Project-02-Docker-Nginx-GitHub-Actions

      # ----------------------------------------
      # 4. Push Docker image to Docker Hub
      # ----------------------------------------
      - name: Push Docker image
        run: |
          docker push \
            ${{ secrets.DOCKERHUB_USERNAME }}/project-02-docker-nginx-github-actions:latest

      # ----------------------------------------
      # 5. Configure SSH
      # ----------------------------------------
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          echo "${{ secrets.SERVER_SSH_KEY }}" > ~/.ssh/project02_key
          chmod 600 ~/.ssh/project02_key

          ssh-keyscan -H "${{ secrets.SERVER_HOST }}" >> ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      # ----------------------------------------
      # 6. Deploy to OCI VM
      # ----------------------------------------
      - name: Deploy to OCI VM
        run: |
          ssh \
            -i ~/.ssh/project02_key \
            -o StrictHostKeyChecking=yes \
            "${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}" \
            "/home/ubuntu/DevOps_Projects/Project-02-Docker-Nginx-GitHub-Actions/scripts/deploy.sh"

      # ----------------------------------------
      # 7. Verify deployment
      # ----------------------------------------
      - name: Verify deployment
        run: |
          ssh \
            -i ~/.ssh/project02_key \
            -o StrictHostKeyChecking=yes \
            "${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}" \
            "curl -fsS http://localhost/health"

      # ----------------------------------------
      # 8. Deployment summary
      # ----------------------------------------
      - name: Deployment successful
        run: |
          echo "========================================="
          echo "Project-02 deployment completed"
          echo "========================================="
          echo "Docker image pushed to Docker Hub"
          echo "OCI VM deployment completed"
          echo "Application health check passed"
          echo "========================================="
